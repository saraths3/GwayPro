{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CwayPro - Login</title>
    <link rel="stylesheet" href="{% static 'css/account/login.css' %}">
</head>
<body>
    <main class="auth-container">
        <header class="auth-header">
            <div class="brand-badge">
                <span class="material-symbols-outlined">terminal</span>
                <span>CwayPro API</span>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your automated code review dashboard and API tokens.</p>
        </header>

        <div class="auth-actions">
            <!-- Google OAuth Form -->
            <form action="{% provider_login_url 'google' %}" method="post" class="auth-form">
                {% csrf_token %}
                <button type="submit" class="btn-oauth">
                    <span class="material-symbols-outlined">g_translate</span>
                    <span>Continue with Google</span>
                </button>
            </form>

            <!-- GitHub OAuth Form -->
            <form action="{% provider_login_url 'github' %}" method="post" class="auth-form">
                {% csrf_token %}
                <button type="submit" class="btn-oauth">
                    <span class="material-symbols-outlined">code</span>
                    <span>Continue with GitHub</span>
                </button>
            </form>
        </div>

        <footer class="auth-footer">
            <p>Protected by CwayPro Encrypted API Engine</p>
        </footer>
    </main>
</body>
</html>
